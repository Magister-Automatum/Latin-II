body.neut-on .neut{background:#fffbe6;border-bottom:2px dotted #c9920a;padding-bottom:1px;border-radius:2px;}

/* TOPBAR */
#topbar{position:sticky;top:0;z-index:200;background:#2c1a0e;color:#f5f0e8;
  display:flex;align-items:center;gap:12px;padding:0 16px;height:48px;font-size:.85rem;}
#topbar h1{font-size:1rem;font-weight:700;letter-spacing:.03em;flex-shrink:0;}
#topbar .spacer{flex:1;}
#score-disp{font-size:.8rem;opacity:.85;white-space:nowrap;}
.tb-btn{background:transparent;border:1px solid #7a5c3a;color:#f5f0e8;border-radius:4px;padding:3px 10px;font-size:.78rem;cursor:pointer;}
.tb-btn:hover{background:#3d2510;}
.badge{font-size:.7rem;background:#7a5c3a;padding:2px 8px;border-radius:10px;white-space:nowrap;}

/* SETTINGS PANEL */
#settings-panel{position:fixed;top:48px;right:0;width:280px;background:#2c1a0e;color:#f5f0e8;
  padding:16px;z-index:199;transform:translateX(100%);transition:transform .2s ease;border-left:2px solid #7a5c3a;}
#settings-panel.open{transform:translateX(0);}
.sp-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:.88rem;}
.sp-row label{line-height:1.3;}
.toggle{appearance:none;width:40px;height:22px;border-radius:11px;background:#5a3a1a;cursor:pointer;position:relative;flex-shrink:0;transition:background .15s;}
.toggle:checked{background:#b87333;}
.toggle::after{content:&#x27;&#x27;;position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s;}
.toggle:checked::after{left:21px;}
.sp-legend{font-size:.78rem;margin-top:4px;line-height:1.5;}
.leg-swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle;}
.leg-r{background:#c0392b;}.leg-b{background:#2471a3;}.leg-g{background:#1e8449;}
#neut-explain{background:#3d2510;border-radius:5px;padding:8px 10px;font-size:.76rem;color:#ffe8a0;line-height:1.6;margin-top:4px;}
#charmap{display:none;background:#fff3d6;padding:7px 16px;font-size:.82rem;border-bottom:1px solid #e0cdb0;}

/* PAGE WRAPPER */
#page{max-width:920px;margin:0 auto;padding:20px 16px 60px;}

/* HOME */
.home-header{text-align:center;padding:28px 0 20px;}
.home-header h2{font-size:1.7rem;color:#2c1a0e;}
.home-header p{color:#7a5c3a;margin-top:6px;font-size:.92rem;font-style:italic;}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px;}
@media(max-width:600px){.home-grid{grid-template-columns:1fr;}}
.home-card{background:#fffdf7;border:2px solid #c8a97e;border-radius:10px;padding:24px 20px;cursor:pointer;
  transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;text-align:center;}
.home-card:hover{border-color:#7a5c3a;box-shadow:0 3px 14px rgba(0,0,0,.12);}
.home-card .hc-icon{font-size:2.4rem;margin-bottom:12px;}
.home-card h3{font-size:1.1rem;color:#2c1a0e;margin-bottom:4px;}
.home-card .hc-latin{font-style:italic;color:#7a5c3a;font-size:.84rem;margin-bottom:10px;}
.home-card p{font-size:.86rem;color:#444;line-height:1.55;}
.home-card .hc-btn{margin-top:18px;background:#2c1a0e;color:#f5f0e8;border:none;border-radius:6px;padding:9px 22px;font-size:.9rem;cursor:pointer;font-family:inherit;}
.home-card .hc-btn:hover{background:#4a2d15;}
.bridge-note{max-width:640px;margin:22px auto 0;background:#e8f0e4;border:1.5px solid #7fa06a;border-radius:8px;padding:12px 16px;font-size:.85rem;color:#2d4a1e;line-height:1.6;}

/* INTRO CARDS */
.intro-card{background:#fff3d6;border:2px solid #d9b45a;border-radius:10px;padding:20px 20px 16px;margin-bottom:16px;}
.intro-card h2{font-size:1.05rem;color:#5a4000;margin-bottom:10px;}
.intro-card p{font-size:.88rem;color:#5a4000;line-height:1.65;margin-bottom:10px;}
.ex-sent{background:#fff;border-left:4px solid #c9920a;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:.93rem;line-height:1.75;}
.ex-sent .eng{font-size:.8rem;color:#666;display:block;margin-top:3px;font-style:italic;}
.ex-sent .neut{background:#fffbe6;border-bottom:2px dotted #c9920a;}

/* VOCAB TABLE */
.vocab-table{width:100%;border-collapse:collapse;margin:10px 0 14px;background:#fffdf7;font-size:.86rem;}
.vocab-table th{background:#f0e8d8;border:1px solid #c8a97e;padding:6px 9px;text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:#5a4000;}
.vocab-table td{border:1px solid #c8a97e;padding:6px 9px;vertical-align:top;}
.vocab-table td.vt-latin{font-style:italic;font-weight:700;white-space:nowrap;}
.vocab-table td.vt-der{min-width:90px;color:#aaa;}
.vt-n{font-size:.68rem;background:#c9920a;color:#fff;border-radius:8px;padding:1px 6px;margin-left:5px;font-style:normal;font-weight:400;vertical-align:middle;}

/* BACK LINK */
.back-link{font-size:.82rem;color:#7a5c3a;cursor:pointer;display:inline-block;margin-bottom:14px;}
.back-link:hover{text-decoration:underline;}

/* STORY LAYOUT */
.story-layout{display:grid;grid-template-columns:160px 1fr 250px;gap:16px;}
@media(max-width:860px){.story-layout{grid-template-columns:1fr;}
  .story-col{order:1;}.vocab-bar-col{order:2;}.summary-col{order:3;position:static;}}
.story-col{min-width:0;}
.vocab-bar-col{min-width:0;}
.vocab-bar{background:#fffbe6;border:1.5px solid #d9b45a;border-radius:8px;padding:12px;font-size:.76rem;position:sticky;top:58px;}
.vocab-bar h4{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#a06b00;margin-bottom:8px;}
.vb-row{margin-bottom:6px;line-height:1.45;}
.vb-lat{font-style:italic;font-weight:700;color:#2c1a0e;}
.vb-def{color:#555;}
.vb-note{font-size:.68rem;color:#a06b00;font-style:italic;margin-top:8px;border-top:1px solid #e0cdb0;padding-top:6px;line-height:1.5;}
.scene-label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#7a5c3a;margin-bottom:10px;}
.path-badge{display:inline-block;font-size:.78rem;font-weight:700;background:#2c1a0e;color:#f5f0e8;padding:3px 12px;border-radius:4px;margin-bottom:10px;letter-spacing:.05em;}
.converge-note{font-size:.76rem;color:#7a5c3a;font-style:italic;margin-bottom:6px;}
.prediction-echo{background:#f8f3ec;border-left:3px solid #c8a97e;padding:8px 12px;font-size:.84rem;color:#555;font-style:italic;margin-bottom:12px;border-radius:0 4px 4px 0;}

/* LATIN TEXT */
p.latin{font-size:1.04rem;line-height:1.9;margin-bottom:14px;}
p.latin .sp{font-style:italic;color:#3a1a6e;}
.glosses{background:#f0e8d8;border-left:3px solid #c8a97e;padding:8px 12px;border-radius:0 4px 4px 0;font-size:.81rem;margin:12px 0;line-height:1.8;}
hr.div{border:none;border-top:1px solid #d4cce8;margin:12px 0;}
.feat-box{background:#fffbe6;border:1.5px solid #c9920a;border-radius:8px;padding:10px 14px;margin:12px 0;}
.feat-box .fb-lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#a06b00;margin-bottom:4px;}
.feat-box .fb-latin{font-size:1.05rem;font-style:italic;}

/* COMPREHENSION BLOCK */
.comp-block{background:#fff;border:1.5px solid #c8a97e;border-radius:8px;padding:16px 18px;margin-top:16px;}
.comp-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7a5c3a;margin-bottom:12px;}
.comp-q{margin-bottom:16px;}
.comp-q:last-child{margin-bottom:0;}
.cq-prompt{font-size:.89rem;margin-bottom:8px;line-height:1.5;}
.cq-prompt em{font-style:italic;}
.mc-list{list-style:none;}
.mc-list li{margin-bottom:5px;}
.mc-btn{width:100%;text-align:left;background:#f8f3ec;border:1px solid #c8a97e;border-radius:5px;padding:7px 10px;font-size:.85rem;cursor:pointer;font-family:inherit;line-height:1.4;transition:background .1s;}
.mc-btn:hover:not(:disabled){background:#f0e4cf;}
.mc-btn:disabled{cursor:default;}
.mc-btn.c-ok{background:#d4edda;border-color:#28a745;}
.mc-btn.c-err{background:#f8d7da;border-color:#dc3545;}
.fb{display:none;font-size:.83rem;padding:8px 11px;border-radius:5px;margin-top:6px;line-height:1.5;}
.fb.show{display:block;}
.fb.ok{background:#d4edda;color:#155724;}
.fb.err{background:#f8d7da;color:#721c24;}
.rq-prompt{font-size:.89rem;margin-bottom:7px;line-height:1.5;}
.rq-input{width:100%;border:1px solid #c8a97e;border-radius:5px;padding:7px 9px;font-family:inherit;font-size:.87rem;background:#faf6ef;resize:vertical;min-height:46px;}
.rq-controls{margin-top:6px;}
.rq-btn{background:#f0e4cf;border:1px solid #c8a97e;border-radius:5px;padding:5px 14px;font-size:.81rem;cursor:pointer;font-family:inherit;}
.rq-btn:hover:not(:disabled){background:#e0d0b0;}
.rq-answer{background:#fff3cd;border:1px solid #ffc107;border-radius:5px;padding:8px 11px;font-size:.84rem;margin-top:7px;display:none;line-height:1.5;}

/* SUMMARY COLUMN */
.summary-col{position:sticky;top:58px;align-self:start;}
.summary-card{background:#fffdf7;border:1.5px solid #c8a97e;border-radius:8px;padding:16px;}
.sum-label{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7a5c3a;margin-bottom:6px;}
.sum-hint{font-size:.77rem;color:#888;margin-bottom:8px;line-height:1.4;}
.sum-textarea{width:100%;border:1px solid #c8a97e;border-radius:5px;padding:8px;font-family:inherit;font-size:.87rem;resize:vertical;min-height:90px;background:#faf6ef;}
.sum-count{font-size:.71rem;color:#888;text-align:right;margin-top:3px;}

/* DECISION */
.decision-banner{background:#2c1a0e;color:#f5f0e8;border-radius:8px;padding:14px 18px;margin:20px 0 14px;}
.decision-banner h3{font-size:1rem;margin-bottom:4px;}
.decision-banner p{font-size:.84rem;opacity:.9;line-height:1.5;}
.choices-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:700px){.choices-grid{grid-template-columns:1fr;}}
.choice-card{background:#fffdf7;border:1.5px solid #c8a97e;border-radius:8px;padding:14px;}
.cc-via{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7a5c3a;margin-bottom:5px;}
.cc-latin{font-size:.91rem;line-height:1.5;margin-bottom:5px;font-style:italic;}
.cc-sub{display:block;font-size:.77rem;color:#666;font-style:normal;margin-top:3px;}
.cc-choose-btn{margin-top:10px;width:100%;background:#2c1a0e;color:#f5f0e8;border:none;border-radius:5px;padding:8px;font-size:.85rem;cursor:pointer;font-family:inherit;}
.cc-choose-btn:hover{background:#4a2d15;}
.cc-predict-lbl{font-size:.74rem;color:#7a5c3a;margin:10px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.cc-predict-input{width:100%;border:1px solid #c8a97e;border-radius:5px;padding:6px 8px;font-size:.83rem;font-family:inherit;min-height:58px;resize:vertical;background:#faf6ef;}
.cc-count{font-size:.71rem;color:#888;text-align:right;margin-top:2px;}
.cc-gate-btn{margin-top:8px;width:100%;background:#ccc;color:#555;border:none;border-radius:5px;padding:8px;font-size:.85rem;cursor:not-allowed;font-family:inherit;}
.cc-gate-btn.ready{background:#2c1a0e;color:#f5f0e8;cursor:pointer;}
.cc-gate-btn.ready:hover{background:#4a2d15;}

/* BUTTONS */
.btn-block{margin-top:20px;}
.btn-primary{background:#2c1a0e;color:#f5f0e8;border:none;border-radius:6px;padding:10px 22px;font-size:.92rem;cursor:pointer;font-family:inherit;display:none;}
.btn-primary.show{display:inline-block;}
.btn-primary:hover{background:#4a2d15;}
.btn-secondary{background:transparent;color:#2c1a0e;border:2px solid #2c1a0e;border-radius:6px;padding:9px 22px;font-size:.9rem;cursor:pointer;font-family:inherit;margin-top:10px;display:block;width:100%;}
.btn-secondary:hover{background:#f0e8d8;}
.full-card{background:#fffdf7;border:1.5px solid #c8a97e;border-radius:10px;padding:22px 20px 18px;margin-bottom:16px;}

/* RESULTS */
.result-score-box{background:#f0e8d8;border-radius:8px;padding:14px 18px;margin-bottom:14px;}
.result-score-box h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:#7a5c3a;margin-bottom:6px;}
.big-score{font-size:1.9rem;font-weight:bold;color:#2c1a0e;}
.score-comment{font-size:.87rem;color:#6b5b4e;margin-top:3px;}
.route-line{font-size:.85rem;color:#555;margin-bottom:10px;line-height:1.6;}
.sum-review{margin-bottom:10px;}
.sum-review h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:#7a5c3a;margin-bottom:3px;}
.sum-review p{font-size:.87rem;background:#fff;border-radius:6px;padding:8px 10px;color:#555;font-style:italic;line-height:1.5;}
.produce-box{background:#e8f0e4;border:1.5px solid #7fa06a;border-radius:8px;padding:14px 16px;margin:14px 0;}
.produce-box h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:#2d4a1e;margin-bottom:6px;}
.produce-box p{font-size:.86rem;color:#2d4a1e;line-height:1.55;margin-bottom:8px;}

/* PRACTICE SECTION */
.acc-header{text-align:center;padding:16px 0 18px;}
.acc-header h2{font-size:1.4rem;color:#2c1a0e;}
.acc-header p{font-size:.87rem;color:#555;margin-top:6px;line-height:1.5;}
.acc-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.ast{flex:1;min-width:110px;background:#f0e8d8;border:1.5px solid #c8a97e;border-radius:6px;padding:8px 10px;text-align:center;font-size:.81rem;cursor:pointer;font-family:inherit;transition:background .1s,color .1s;}
.ast.active{background:#2c1a0e;color:#f5f0e8;border-color:#2c1a0e;}
.ast-shuffle{flex:0 0 auto;min-width:auto;background:#1e4d35;color:#e0ffe8;border-color:#1e4d35;}
.ast-shuffle:hover{background:#256040;}
.acc-layout{display:grid;grid-template-columns:240px 1fr;gap:20px;}
.acc-layout .acc-ref{grid-column:1;grid-row:1;align-self:start;}
.acc-layout .acc-main{grid-column:2;grid-row:1;min-width:0;}
@media(max-width:700px){.acc-layout{grid-template-columns:1fr;}
  .acc-layout .acc-ref{grid-column:1;grid-row:2;position:static;}
  .acc-layout .acc-main{grid-column:1;grid-row:1;}}
.acc-ref{background:#f0e8d8;border:1px solid #c8a97e;border-radius:8px;padding:14px;font-size:.79rem;position:sticky;top:58px;}
.acc-ref h4{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7a5c3a;margin-bottom:10px;}
.wb-row{display:grid;grid-template-columns:90px 16px auto;gap:2px;font-size:.78rem;line-height:1.7;align-items:baseline;}
.wb-nom{color:#555;font-style:italic;}.wb-arr{color:#bbb;text-align:center;}.wb-acc{font-weight:700;font-style:italic;}
.wb-head{font-weight:700;font-size:.75rem;color:#2c1a0e;margin:8px 0 4px;}
.wb-note{font-size:.69rem;color:#888;font-style:italic;margin-top:2px;}
.acc-intro{background:#fff;border:1px solid #c8a97e;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:.87rem;line-height:1.6;}
.acc-rule{background:#fff3cd;border-left:3px solid #ffc107;padding:7px 11px;font-size:.83rem;margin:8px 0;border-radius:0 5px 5px 0;}
.spot-sent{background:#fffdf7;border:1px solid #c8a97e;border-radius:7px;padding:11px 13px;margin-bottom:9px;}
.spot-num{font-size:.68rem;color:#7a5c3a;font-weight:700;text-transform:uppercase;margin-bottom:6px;}
.spot-words{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:5px;align-items:center;}
.word-btn{background:#f8f3ec;border:1.5px solid #c8a97e;border-radius:5px;padding:5px 12px;font-size:.97rem;cursor:pointer;font-family:inherit;font-style:italic;transition:background .1s,border-color .1s;}
.word-btn:hover:not(:disabled){background:#f0e0c0;border-color:#a06030;}
.word-btn.correct{background:#d4edda;border-color:#28a745;cursor:default;}
.word-btn.wrong{background:#f8d7da;border-color:#dc3545;}
.spot-period{font-style:italic;color:#888;font-size:.95rem;}
.spot-fb{font-size:.8rem;min-height:17px;margin-top:3px;line-height:1.4;}
.spot-fb.ok{color:#155724;}.spot-fb.err{color:#721c24;}
.sort-grid{display:flex;flex-direction:column;gap:8px;}
.sort-item{background:#fff;border:1px solid #c8a97e;border-radius:8px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.sort-word{font-size:.97rem;font-style:italic;flex:1;}
.sort-btns{display:flex;gap:5px;}
.sb{padding:6px 11px;border-radius:6px;border:2px solid #c8a97e;background:#f8f3ec;font-family:Georgia,serif;font-size:.82rem;cursor:pointer;font-weight:600;transition:all .12s;min-width:40px;}
.sb:hover:not(:disabled){border-color:#7a5c3a;background:#f0e8d8;}
.sb.s-ok{background:#d4edda;border-color:#28a745;}
.sb.s-err{background:#f8d7da;border-color:#dc3545;}
.sb.s-rev{background:#d4edda;border-color:#28a745;}
.sb:disabled{cursor:default;opacity:.75;}
.sort-tally{font-size:.78rem;color:#6b5b4e;margin-top:6px;}

/* PRINT */
@media print{
  #topbar,#settings-panel,#charmap,.back-link,.choices-grid,.decision-banner,
  .btn-block,.comp-block,.rq-controls,.rq-answer,.rq-input,.bridge-note,
  .cc-choose-btn{display:none!important;}
  body{background:#fff;color:#000;font-size:9pt;}
  #page{display:none!important;}
  #print-body{display:block!important;font-family:Arial,sans-serif;font-size:9pt;color:#000;max-width:100%;}
  .ws-title{font-size:12pt;font-weight:bold;margin-bottom:2pt;}
  .ws-sub{font-size:8pt;color:#333;margin-bottom:6pt;}
  .ws-meta{font-size:8pt;color:#555;margin-bottom:10pt;}
  .ws-prediction{font-size:8.5pt;font-style:italic;border-left:3pt solid #999;padding:4pt 8pt;margin-bottom:10pt;background:#f9f9f9;}
  .ws-section{margin-bottom:0;page-break-inside:avoid;}
  .ws-h{font-size:9.5pt;font-weight:bold;margin:8pt 0 4pt;}
  .ws-para{text-align:justify;font-size:9pt;line-height:1.5;margin-bottom:5pt;}
  .ws-gloss{font-size:8pt;margin-bottom:6pt;line-height:1.7;}
  .ws-gloss b{font-weight:bold;}
  .q-table{width:100%;border-collapse:collapse;margin-bottom:7pt;}
  .q-table td{border:1px solid #000;padding:4pt 6pt;vertical-align:top;width:50%;height:88pt;font-size:8pt;line-height:1.4;}
  .feat-sent{font-size:9pt;font-style:italic;margin-top:6pt;margin-bottom:3pt;}
  .ws-student-table{width:100%;border-collapse:collapse;margin-top:6pt;margin-bottom:2pt;}
  .ws-student-table td{border:1px solid #000;width:50%;padding:4pt 6pt;vertical-align:top;height:60pt;font-size:8pt;}
  .ws-stu-label{font-size:7.5pt;font-weight:bold;display:block;margin-bottom:3pt;}
  .ws-student-content{font-style:italic;font-size:8pt;color:#333;}
  .ws-neut-box{border:1.5pt solid #000;padding:7pt;margin-bottom:7pt;page-break-inside:avoid;}
  .ws-neut-box h4{font-size:8.5pt;margin-bottom:3pt;}
  .ws-neut-table{width:100%;border-collapse:collapse;}
  .ws-neut-table td{border:1pt solid #000;height:44pt;padding:3pt 4pt;font-size:7.5pt;vertical-align:top;}
  .ws-vocab-table{width:100%;border-collapse:collapse;margin-bottom:8pt;}
  .ws-vocab-table td,.ws-vocab-table th{border:1pt solid #000;padding:2pt 5pt;font-size:7.5pt;text-align:left;vertical-align:top;}
  .ws-vocab-table th{background:#eee;}
  .ws-vocab-table td.wsv-der{width:120pt;}
  .ws-produce-box{border:1.5pt solid #000;padding:7pt;margin-top:8pt;page-break-inside:avoid;}
  .ws-produce-box h4{font-size:8.5pt;margin-bottom:4pt;}
  .sect-line{border:none;border-bottom:1px solid #000;margin-top:3pt;margin-bottom:16pt;height:16pt;display:block;}
  .ws-cog-box{border:1pt dashed #000;padding:7pt;margin-top:8pt;}
  .ws-cog-box h4{font-size:8.5pt;margin-bottom:3pt;}

&lt;script&gt;
/* HELPERS */
const n1 = t =&gt; `&lt;span class=&quot;n1&quot;&gt;${t}&lt;/span&gt;`;
const n2 = t =&gt; `&lt;span class=&quot;n2&quot;&gt;${t}&lt;/span&gt;`;
const n3 = t =&gt; `&lt;span class=&quot;n3&quot;&gt;${t}&lt;/span&gt;`;

const nn3= t =&gt; `&lt;span class=&quot;n3 neut&quot;&gt;${t}&lt;/span&gt;`;   /* 3rd decl neuter */
const pf = t =&gt; `&lt;span class=&quot;neut&quot;&gt;${t}&lt;/span&gt;`;      /* genitive highlight   */
const pg = () =&gt; document.getElementById(&#x27;page&#x27;);
const $  = id =&gt; document.getElementById(id);
function gl(pairs){ return pairs.map(([k,v])=&gt;`&lt;b&gt;${k}&lt;/b&gt; = ${v}`).join(&#x27; &amp;nbsp;|&amp;nbsp; &#x27;); }
function gbox(pairs){ return pairs.length ? `&lt;div class=&quot;glosses&quot;&gt;${gl(pairs)}&lt;/div&gt;` : &#x27;&#x27;; }

/* STATE */
const S = {
  path:{p2:null,p3:null,end:null}, predictions:{},
  summaries:{s1:&#x27;&#x27;,s2:&#x27;&#x27;,s3:&#x27;&#x27;,s4:&#x27;&#x27;}, questions:{s1:&#x27;&#x27;,s2:&#x27;&#x27;,s3:&#x27;&#x27;,s4:&#x27;&#x27;},
  score:{c:0,t:0}, spotState:{},
};

function updateScore(){
  const d=$(&#x27;score-disp&#x27;);
  if(d) d.textContent = S.score.t&gt;0 ? `${S.score.c} / ${S.score.t}` : &#x27;&#x27;;
}
function toggleSettings(){ $(&#x27;settings-panel&#x27;).classList.toggle(&#x27;open&#x27;); }
function applySupports(){
  document.body.classList.toggle(&#x27;review-on&#x27;, $(&#x27;tog-review&#x27;).checked);
  document.body.classList.toggle(&#x27;neut-on&#x27;, $(&#x27;tog-neut&#x27;).checked);
  $(&#x27;charmap&#x27;).style.display = $(&#x27;tog-charmap&#x27;).checked ? &#x27;block&#x27; : &#x27;none&#x27;;
}
document.addEventListener(&#x27;click&#x27;,e=&gt;{
  const p=$(&#x27;settings-panel&#x27;);
  if(p&amp;&amp;p.classList.contains(&#x27;open&#x27;)&amp;&amp;!p.contains(e.target)&amp;&amp;!e.target.closest(&#x27;.tb-btn&#x27;))
    p.classList.remove(&#x27;open&#x27;);
});
function mcAnswer(listId, fbId, chosen, correct, okTxt, errTxt){
  S.score.t++; const ok=(chosen===correct); if(ok) S.score.c++;
  updateScore();
  document.querySelectorAll(`#${listId} .mc-btn`).forEach(b=&gt;b.disabled=true);
  document.querySelectorAll(`#${listId} .mc-btn`)[chosen].classList.add(ok?&#x27;c-ok&#x27;:&#x27;c-err&#x27;);
  if(!ok) document.querySelectorAll(`#${listId} .mc-btn`)[correct].classList.add(&#x27;c-ok&#x27;);
  const fb=$(fbId); fb.textContent=ok?okTxt:errTxt; fb.className=`fb show ${ok?&#x27;ok&#x27;:&#x27;err&#x27;}`;
}
function revealAnswer(id){
  $(id).style.display=&#x27;block&#x27;;
  const b=$(`${id}-btn`); if(b){b.textContent=&#x27;Answer shown&#x27;;b.disabled=true;}
}
function saveSum(key, gateFn){
  S.summaries[key]=($(`sum-${key}`)||{value:&#x27;&#x27;}).value;
  const n=S.summaries[key].trim().length, cnt=$(`cnt-${key}`);
  if(cnt){ cnt.textContent=`${n} / 30 minimum`; cnt.style.color=n&gt;=30?&#x27;#1e8449&#x27;:&#x27;#888&#x27;; }
  if(gateFn&amp;&amp;window[gateFn]) window[gateFn]();
}
function saveQ(key){ S.questions[key]=($(`q-${key}`)||{value:&#x27;&#x27;}).value; }
function summaryCol(key, gateFn){
  const n=(S.summaries[key]||&#x27;&#x27;).trim().length;
  return `&lt;div class=&quot;summary-col&quot;&gt;&lt;div class=&quot;summary-card&quot;&gt;
    &lt;div class=&quot;sum-label&quot;&gt;📝 Summa mea &lt;span style=&quot;color:#c0392b;&quot;&gt;(required)&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sum-hint&quot;&gt;What happened in this section? (Latin or English) — note one &lt;b&gt;genitive (an of/’s word)&lt;/b&gt; you met. &lt;b&gt;30 characters minimum&lt;/b&gt; to unlock the next decision.&lt;/div&gt;
    &lt;textarea class=&quot;sum-textarea&quot; id=&quot;sum-${key}&quot; placeholder=&quot;Write your summary…&quot;
      oninput=&quot;saveSum(&#x27;${key}&#x27;,&#x27;${gateFn||&#x27;&#x27;}&#x27;)&quot;&gt;${S.summaries[key]||&#x27;&#x27;}&lt;/textarea&gt;
    &lt;div class=&quot;sum-count&quot; id=&quot;cnt-${key}&quot;&gt;${n} / 30 minimum&lt;/div&gt;
    &lt;div class=&quot;sum-label&quot; style=&quot;margin-top:12px;&quot;&gt;❓ Quaestiōnēs meae&lt;/div&gt;
    &lt;div class=&quot;sum-hint&quot;&gt;What do you wonder about? What confused you?&lt;/div&gt;
    &lt;textarea class=&quot;sum-textarea&quot; id=&quot;q-${key}&quot; placeholder=&quot;Write your questions…&quot;
      style=&quot;min-height:70px;&quot; oninput=&quot;saveQ(&#x27;${key}&#x27;)&quot;&gt;${S.questions[key]||&#x27;&#x27;}&lt;/textarea&gt;
  &lt;/div&gt;&lt;/div&gt;`;
}
function attrStr(s){ return s.replace(/\\/g,&#x27;\\\\&#x27;).replace(/&#x27;/g,&quot;\\&#x27;&quot;).replace(/&quot;/g,&#x27;&amp;quot;&#x27;); }
function compBlock(prefix, mc, rev){
  return `&lt;div class=&quot;comp-block&quot;&gt;
    &lt;div class=&quot;comp-label&quot;&gt;📖 Comprehension&lt;/div&gt;
    &lt;div class=&quot;comp-q&quot;&gt;
      &lt;div class=&quot;cq-prompt&quot;&gt;&lt;b&gt;1.&lt;/b&gt; ${mc.prompt}&lt;/div&gt;
      &lt;ul class=&quot;mc-list&quot; id=&quot;mc-${prefix}&quot;&gt;
        ${mc.opts.map((o,i)=&gt;`&lt;li&gt;&lt;button class=&quot;mc-btn&quot; onclick=&quot;mcAnswer(&#x27;mc-${prefix}&#x27;,&#x27;fb-${prefix}&#x27;,${i},${mc.correct},
          &#x27;${attrStr(mc.ok)}&#x27;,&#x27;${attrStr(mc.err)}&#x27;)&quot;&gt;${o}&lt;/button&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}
      &lt;/ul&gt;
      &lt;div class=&quot;fb&quot; id=&quot;fb-${prefix}&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;comp-q&quot;&gt;
      &lt;div class=&quot;rq-prompt&quot;&gt;&lt;b&gt;2.&lt;/b&gt; ${rev.prompt}&lt;/div&gt;
      &lt;textarea class=&quot;rq-input&quot; placeholder=&quot;Write your answer first, then check…&quot; rows=&quot;2&quot;&gt;&lt;/textarea&gt;
      &lt;div class=&quot;rq-controls&quot;&gt;&lt;button class=&quot;rq-btn&quot; id=&quot;rev-${prefix}-btn&quot; onclick=&quot;revealAnswer(&#x27;rev-${prefix}&#x27;)&quot;&gt;Show answer&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;rq-answer&quot; id=&quot;rev-${prefix}&quot;&gt;${rev.answer}&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;`;
}

function decisionGrid(decId, cards, handler, sumKey){
  const order=[...cards];
  for(let i=order.length-1;i&gt;0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  return `&lt;div class=&quot;choices-grid&quot; id=&quot;${decId}&quot;&gt;
    ${order.map((c,i)=&gt;`&lt;div class=&quot;choice-card&quot;&gt;
      &lt;div class=&quot;cc-via&quot;&gt;Via ${[&#x27;I&#x27;,&#x27;II&#x27;,&#x27;III&#x27;][i]}&lt;/div&gt;
      &lt;div class=&quot;cc-latin&quot;&gt;${c.latin}&lt;span class=&quot;cc-sub&quot;&gt;${c.sub}&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;cc-predict-lbl&quot;&gt;Prediction (required) — what happens on this path?&lt;/div&gt;
      &lt;textarea class=&quot;cc-predict-input&quot; id=&quot;pred-${decId}-${c.key}&quot; placeholder=&quot;Predict (30+ characters), then choose…&quot;
        oninput=&quot;gateDec(&#x27;${decId}&#x27;,&#x27;${sumKey}&#x27;)&quot;&gt;&lt;/textarea&gt;
      &lt;div class=&quot;cc-count&quot; id=&quot;pcnt-${decId}-${c.key}&quot;&gt;0 / 30 minimum&lt;/div&gt;
      &lt;button class=&quot;cc-gate-btn&quot; id=&quot;choose-${decId}-${c.key}&quot; onclick=&quot;tryChoose(&#x27;${handler}&#x27;,&#x27;${decId}&#x27;,&#x27;${c.key}&#x27;)&quot;&gt;Choose this path →&lt;/button&gt;
    &lt;/div&gt;`).join(&#x27;&#x27;)}
  &lt;/div&gt;`;
}
function gateDec(decId, sumKey){
  const sumOk=(($(`sum-${sumKey}`)||{value:&#x27;&#x27;}).value.trim().length)&gt;=30;
  document.querySelectorAll(`#${decId} .cc-predict-input`).forEach(p=&gt;{
    const key=p.id.split(&#x27;-&#x27;).pop();
    const n=p.value.trim().length;
    const cnt=$(`pcnt-${decId}-${key}`);
    if(cnt){ cnt.textContent=`${n} / 30 minimum`; cnt.style.color=n&gt;=30?&#x27;#1e8449&#x27;:&#x27;#888&#x27;; }
    const b=$(`choose-${decId}-${key}`);
    if(b) b.classList.toggle(&#x27;ready&#x27;, sumOk &amp;&amp; n&gt;=30);
  });
}
function tryChoose(handler, decId, key){
  const b=$(`choose-${decId}-${key}`);
  if(!b||!b.classList.contains(&#x27;ready&#x27;)) return;
  window[handler](key);
}
function grabPred(decId,key){
  const p=$(`pred-${decId}-${key}`);
  if(p&amp;&amp;p.value.trim()) S.predictions[decId]=p.value.trim();
}

function spotTap(si,wi,uid){
  const s=SPOT[si];
  if(S.spotState[uid]) return;
  const ok=(wi===s.pf);
  S.spotState[uid]=true;
  S.score.t++; if(ok) S.score.c++; updateScore();
  const btn=$(`${uid}-${wi}`);
  btn.classList.add(ok?&#x27;correct&#x27;:&#x27;wrong&#x27;);
  if(!ok) $(`${uid}-${s.pf}`).classList.add(&#x27;correct&#x27;);
  for(let i=0;i&lt;s.words.length;i++){ const b=$(`${uid}-${i}`); if(b) b.disabled=true; }
  const fb=$(`${uid}-fb`);
  fb.textContent=(ok?&#x27;Optimē! &#x27;:&#x27;&#x27;)+s.note;
  fb.className=`spot-fb ${ok?&#x27;ok&#x27;:&#x27;err&#x27;}`;
}
function numTap(i,choice,uid){
  const w=NUMSORT[i];
  if(S.spotState[uid]) return;
  S.spotState[uid]=true;
  const correct=w.pf?2:1, ok=(choice===correct);
  S.score.t++; if(ok) S.score.c++; updateScore();
  [1,2].forEach(d=&gt;{
    const b=$(`${uid}-${d}`); if(!b) return; b.disabled=true;
    if(d===choice) b.classList.add(ok?&#x27;s-ok&#x27;:&#x27;s-err&#x27;);
    if(!ok&amp;&amp;d===correct) b.classList.add(&#x27;s-rev&#x27;);
  });
  const fb=$(`${uid}-fb`);
  fb.textContent=(ok?&#x27;Optimē! &#x27;:&#x27;&#x27;)+w.note;
  fb.className=`spot-fb ${ok?&#x27;ok&#x27;:&#x27;err&#x27;}`;
}

.ast{flex:1;min-width:110px;background:#f0e8d8;border:1.5px solid #c8a97e;border-radius:6px;padding:8px 10px;text-align:center;font-size:.81rem;cursor:pointer;font-family:inherit;transition:background .1s,color .1s;}
.ast.active{background:#2c1a0e;color:#f5f0e8;border-color:#2c1a0e;}
.ast-shuffle{flex:0 0 auto;min-width:auto;background:#1e4d35;color:#e0ffe8;border-color:#1e4d35;}
.ast-shuffle:hover{background:#256040;}
.acc-layout{display:grid;grid-template-columns:240px 1fr;gap:20px;}
.acc-layout .acc-ref{grid-column:1;grid-row:1;align-self:start;}
.acc-layout .acc-main{grid-column:2;grid-row:1;min-width:0;}
@media(max-width:700px){.acc-layout{grid-template-columns:1fr;}
  .acc-layout .acc-ref{grid-column:1;grid-row:2;position:static;}
  .acc-layout .acc-main{grid-column:1;grid-row:1;}}
.acc-ref{background:#f0e8d8;border:1px solid #c8a97e;border-radius:8px;padding:14px;font-size:.79rem;position:sticky;top:58px;}
.acc-ref h4{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7a5c3a;margin-bottom:10px;}
.wb-row{display:grid;grid-template-columns:90px 16px auto;gap:2px;font-size:.78rem;line-height:1.7;align-items:baseline;}
.wb-nom{color:#555;font-style:italic;}.wb-arr{color:#bbb;text-align:center;}.wb-acc{font-weight:700;font-style:italic;}
.wb-head{font-weight:700;font-size:.75rem;color:#2c1a0e;margin:8px 0 4px;}
.wb-note{font-size:.69rem;color:#888;font-style:italic;margin-top:2px;}
.acc-intro{background:#fff;border:1px solid #c8a97e;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:.87rem;line-height:1.6;}
.acc-rule{background:#fff3cd;border-left:3px solid #ffc107;padding:7px 11px;font-size:.83rem;margin:8px 0;border-radius:0 5px 5px 0;}
.spot-sent{background:#fffdf7;border:1px solid #c8a97e;border-radius:7px;padding:11px 13px;margin-bottom:9px;}
.spot-num{font-size:.68rem;color:#7a5c3a;font-weight:700;text-transform:uppercase;margin-bottom:6px;}
.spot-words{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:5px;align-items:center;}
.word-btn{background:#f8f3ec;border:1.5px solid #c8a97e;border-radius:5px;padding:5px 12px;font-size:.97rem;cursor:pointer;font-family:inherit;font-style:italic;transition:background .1s,border-color .1s;}
.word-btn:hover:not(:disabled){background:#f0e0c0;border-color:#a06030;}
.word-btn.correct{background:#d4edda;border-color:#28a745;cursor:default;}
.word-btn.wrong{background:#f8d7da;border-color:#dc3545;}
.spot-period{font-style:italic;color:#888;font-size:.95rem;}
.spot-fb{font-size:.8rem;min-height:17px;margin-top:3px;line-height:1.4;}
.spot-fb.ok{color:#155724;}.spot-fb.err{color:#721c24;}
.sort-grid{display:flex;flex-direction:column;gap:8px;}
.sort-item{background:#fff;border:1px solid #c8a97e;border-radius:8px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.sort-word{font-size:.97rem;font-style:italic;flex:1;}
.sort-btns{display:flex;gap:5px;}
.sb{padding:6px 11px;border-radius:6px;border:2px solid #c8a97e;background:#f8f3ec;font-family:Georgia,serif;font-size:.82rem;cursor:pointer;font-weight:600;transition:all .12s;min-width:40px;}
.sb:hover:not(:disabled){border-color:#7a5c3a;background:#f0e8d8;}
.sb.s-ok{background:#d4edda;border-color:#28a745;}
.sb.s-err{background:#f8d7da;border-color:#dc3545;}
.sb.s-rev{background:#d4edda;border-color:#28a745;}
.sb:disabled{cursor:default;opacity:.75;}
.sort-tally{font-size:.78rem;color:#6b5b4e;margin-top:6px;}

&lt;body&gt;

&lt;div id=&quot;topbar&quot;&gt;

    &lt;label&gt;Future highlight&lt;br&gt;
      &lt;span class=&quot;sp-legend&quot; style=&quot;color:#c9920a;&quot;&gt;■ erit · parābit · veniet&lt;/span&gt;
    &lt;/label&gt;

  &lt;/div&gt;
  &lt;div id=&quot;neut-explain&quot;&gt;
    &lt;strong&gt;The future tense:&lt;/strong&gt; WILL — the tense of tomorrow.
    1st/2nd conjugation: &lt;b&gt;-bō / -bis / -bit / -bimus / -bunt&lt;/b&gt; (parābō, docēbis, dabit, dabunt).
    3rd/4th (the sneaky ones): &lt;b&gt;-am / -ēs / -et / -ent&lt;/b&gt; (coquam, coquēs, veniet, venient).
    And sum goes its own way: &lt;b&gt;erō · eris · erit · erimus · erunt&lt;/b&gt;.
    Watch for time-words: crās (tomorrow) · mox (soon) · ōlim (one day).

&lt;div id=&quot;charmap&quot;&gt;
  &lt;b style=&quot;color:#a06b00&quot;&gt;Characters:&lt;/b&gt;
  Grumio — the cook, on the year&#x27;s last night &amp;nbsp;|&amp;nbsp; Cerberus — his dog, whose future is certain &amp;nbsp;|&amp;nbsp;
  astrologus — the fortune-teller from Episode I, back! &amp;nbsp;|&amp;nbsp; Rūfus — the apprentice (Ep. IV) &amp;nbsp;|&amp;nbsp;
  Valerius — the widower (Ep. V) &amp;nbsp;|&amp;nbsp; Publius &amp;amp; fīlia — the merchant and the hungriest guest (Ep. III)

&lt;script&gt;
/* HELPERS */
const n1 = t =&gt; `&lt;span class=&quot;n1&quot;&gt;${t}&lt;/span&gt;`;
const n2 = t =&gt; `&lt;span class=&quot;n2&quot;&gt;${t}&lt;/span&gt;`;
const n3 = t =&gt; `&lt;span class=&quot;n3&quot;&gt;${t}&lt;/span&gt;`;
const nn2= t =&gt; `&lt;span class=&quot;n2 neut&quot;&gt;${t}&lt;/span&gt;`;   /* 2nd decl neuter */
const nn3= t =&gt; `&lt;span class=&quot;n3 neut&quot;&gt;${t}&lt;/span&gt;`;   /* 3rd decl neuter */
const pf = t =&gt; `&lt;span class=&quot;neut&quot;&gt;${t}&lt;/span&gt;`;      /* future highlight     */
const pg = () =&gt; document.getElementById(&#x27;page&#x27;);
const $  = id =&gt; document.getElementById(id);
function gl(pairs){ return pairs.map(([k,v])=&gt;`&lt;b&gt;${k}&lt;/b&gt; = ${v}`).join(&#x27; &amp;nbsp;|&amp;nbsp; &#x27;); }
function gbox(pairs){ return pairs.length ? `&lt;div class=&quot;glosses&quot;&gt;${gl(pairs)}&lt;/div&gt;` : &#x27;&#x27;; }

/* STATE */
const S = {
  path:{p2:null,p3:null,end:null}, predictions:{},
  summaries:{s1:&#x27;&#x27;,s2:&#x27;&#x27;,s3:&#x27;&#x27;,s4:&#x27;&#x27;}, questions:{s1:&#x27;&#x27;,s2:&#x27;&#x27;,s3:&#x27;&#x27;,s4:&#x27;&#x27;},
  score:{c:0,t:0}, spotState:{},
};

function updateScore(){
  const d=$(&#x27;score-disp&#x27;);
  if(d) d.textContent = S.score.t&gt;0 ? `${S.score.c} / ${S.score.t}` : &#x27;&#x27;;
}
function toggleSettings(){ $(&#x27;settings-panel&#x27;).classList.toggle(&#x27;open&#x27;); }
function applySupports(){
  document.body.classList.toggle(&#x27;review-on&#x27;, $(&#x27;tog-review&#x27;).checked);
  document.body.classList.toggle(&#x27;neut-on&#x27;, $(&#x27;tog-neut&#x27;).checked);
  $(&#x27;charmap&#x27;).style.display = $(&#x27;tog-charmap&#x27;).checked ? &#x27;block&#x27; : &#x27;none&#x27;;
}
document.addEventListener(&#x27;click&#x27;,e=&gt;{
  const p=$(&#x27;settings-panel&#x27;);
  if(p&amp;&amp;p.classList.contains(&#x27;open&#x27;)&amp;&amp;!p.contains(e.target)&amp;&amp;!e.target.closest(&#x27;.tb-btn&#x27;))
    p.classList.remove(&#x27;open&#x27;);
});
function mcAnswer(listId, fbId, chosen, correct, okTxt, errTxt){
  S.score.t++; const ok=(chosen===correct); if(ok) S.score.c++;
  updateScore();
  document.querySelectorAll(`#${listId} .mc-btn`).forEach(b=&gt;b.disabled=true);
  document.querySelectorAll(`#${listId} .mc-btn`)[chosen].classList.add(ok?&#x27;c-ok&#x27;:&#x27;c-err&#x27;);
  if(!ok) document.querySelectorAll(`#${listId} .mc-btn`)[correct].classList.add(&#x27;c-ok&#x27;);
  const fb=$(fbId); fb.textContent=ok?okTxt:errTxt; fb.className=`fb show ${ok?&#x27;ok&#x27;:&#x27;err&#x27;}`;
}
function revealAnswer(id){
  $(id).style.display=&#x27;block&#x27;;
  const b=$(`${id}-btn`); if(b){b.textContent=&#x27;Answer shown&#x27;;b.disabled=true;}
}
function saveSum(key, gateFn){
  S.summaries[key]=($(`sum-${key}`)||{value:&#x27;&#x27;}).value;
  const n=S.summaries[key].trim().length, cnt=$(`cnt-${key}`);
  if(cnt){ cnt.textContent=`${n} / 30 minimum`; cnt.style.color=n&gt;=30?&#x27;#1e8449&#x27;:&#x27;#888&#x27;; }
  if(gateFn&amp;&amp;window[gateFn]) window[gateFn]();
}
function saveQ(key){ S.questions[key]=($(`q-${key}`)||{value:&#x27;&#x27;}).value; }
function summaryCol(key, gateFn){
  const n=(S.summaries[key]||&#x27;&#x27;).trim().length;
  return `&lt;div class=&quot;summary-col&quot;&gt;&lt;div class=&quot;summary-card&quot;&gt;
    &lt;div class=&quot;sum-label&quot;&gt;📝 Summa mea &lt;span style=&quot;color:#c0392b;&quot;&gt;(required)&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sum-hint&quot;&gt;What happened in this section? (Latin or English) — note one &lt;b&gt;future verb (a &quot;will ___&quot;)&lt;/b&gt; you met. &lt;b&gt;30 characters minimum&lt;/b&gt; to unlock the next decision.&lt;/div&gt;
    &lt;textarea class=&quot;sum-textarea&quot; id=&quot;sum-${key}&quot; placeholder=&quot;Write your summary…&quot;
      oninput=&quot;saveSum(&#x27;${key}&#x27;,&#x27;${gateFn||&#x27;&#x27;}&#x27;)&quot;&gt;${S.summaries[key]||&#x27;&#x27;}&lt;/textarea&gt;
    &lt;div class=&quot;sum-count&quot; id=&quot;cnt-${key}&quot;&gt;${n} / 30 minimum&lt;/div&gt;
    &lt;div class=&quot;sum-label&quot; style=&quot;margin-top:12px;&quot;&gt;❓ Quaestiōnēs meae&lt;/div&gt;
    &lt;div class=&quot;sum-hint&quot;&gt;What do you wonder about? What confused you?&lt;/div&gt;
    &lt;textarea class=&quot;sum-textarea&quot; id=&quot;q-${key}&quot; placeholder=&quot;Write your questions…&quot;
      style=&quot;min-height:70px;&quot; oninput=&quot;saveQ(&#x27;${key}&#x27;)&quot;&gt;${S.questions[key]||&#x27;&#x27;}&lt;/textarea&gt;
  &lt;/div&gt;&lt;/div&gt;`;
}
function attrStr(s){ return s.replace(/\\/g,&#x27;\\\\&#x27;).replace(/&#x27;/g,&quot;\\&#x27;&quot;).replace(/&quot;/g,&#x27;&amp;quot;&#x27;); }
function compBlock(prefix, mc, rev){
  return `&lt;div class=&quot;comp-block&quot;&gt;
    &lt;div class=&quot;comp-label&quot;&gt;📖 Comprehension&lt;/div&gt;
    &lt;div class=&quot;comp-q&quot;&gt;
      &lt;div class=&quot;cq-prompt&quot;&gt;&lt;b&gt;1.&lt;/b&gt; ${mc.prompt}&lt;/div&gt;
      &lt;ul class=&quot;mc-list&quot; id=&quot;mc-${prefix}&quot;&gt;
        ${mc.opts.map((o,i)=&gt;`&lt;li&gt;&lt;button class=&quot;mc-btn&quot; onclick=&quot;mcAnswer(&#x27;mc-${prefix}&#x27;,&#x27;fb-${prefix}&#x27;,${i},${mc.correct},
          &#x27;${attrStr(mc.ok)}&#x27;,&#x27;${attrStr(mc.err)}&#x27;)&quot;&gt;${o}&lt;/button&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}
      &lt;/ul&gt;
      &lt;div class=&quot;fb&quot; id=&quot;fb-${prefix}&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;comp-q&quot;&gt;
      &lt;div class=&quot;rq-prompt&quot;&gt;&lt;b&gt;2.&lt;/b&gt; ${rev.prompt}&lt;/div&gt;
      &lt;textarea class=&quot;rq-input&quot; placeholder=&quot;Write your answer first, then check…&quot; rows=&quot;2&quot;&gt;&lt;/textarea&gt;
      &lt;div class=&quot;rq-controls&quot;&gt;&lt;button class=&quot;rq-btn&quot; id=&quot;rev-${prefix}-btn&quot; onclick=&quot;revealAnswer(&#x27;rev-${prefix}&#x27;)&quot;&gt;Show answer&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;rq-answer&quot; id=&quot;rev-${prefix}&quot;&gt;${rev.answer}&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;`;
}

/* ═══════════════════════════════════════════
   VOCABULARY
   ═══════════════════════════════════════════ */
const VOCAB = [

  [&#x27;manēbit / manēbunt&#x27;,&#x27;will stay&#x27;,&#x27;F&#x27;],
];
const VB = [
  [&#x27;novus — annus novus&#x27;,&#x27;new — the new year&#x27;,1],
  [&#x27;vīta, -ae&#x27;,&#x27;life&#x27;,1],
  [&#x27;ars, artis&#x27;,&#x27;skill, craft&#x27;,1],
  [&#x27;saepe / numquam&#x27;,&#x27;often / never&#x27;,1],
  [&#x27;cotīdiē&#x27;,&#x27;every day&#x27;,1],

        &lt;li&gt;&lt;button class=&quot;mc-btn&quot; onclick=&quot;neutCheck(${i})&quot;&gt;&lt;em&gt;${w}&lt;/em&gt;&lt;/button&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}

  ];

}
function neutCheck(i){
  const done=document.querySelector(&#x27;#ni-opts .mc-btn:disabled&#x27;); if(done) return;
  S.score.t++; const ok=(i===0); if(ok) S.score.c++; updateScore();
  document.querySelectorAll(&#x27;#ni-opts .mc-btn&#x27;).forEach(b=&gt;b.disabled=true);
  document.querySelectorAll(&#x27;#ni-opts .mc-btn&#x27;)[i].classList.add(ok?&#x27;c-ok&#x27;:&#x27;c-err&#x27;);
  if(!ok) document.querySelectorAll(&#x27;#ni-opts .mc-btn&#x27;)[0].classList.add(&#x27;c-ok&#x27;);
  $(&#x27;ni-fb&#x27;).textContent = ok
    ? &#x27;Optimē! venient (-ent, sneaky future) = they WILL come; coquet (-et) = he WILL cook; and crās stamps the whole sentence with tomorrow. You can now read promises.&#x27;
    : &#x27;Temptā iterum! crās means tomorrow — so can the verbs be happening now? Look at venient and coquet: which tense points forward?&#x27;;
  $(&#x27;ni-fb&#x27;).className=`fb show ${ok?&#x27;ok&#x27;:&#x27;err&#x27;}`;
}

function decisionGrid(decId, cards, handler, sumKey){
  const order=[...cards];
  for(let i=order.length-1;i&gt;0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  return `&lt;div class=&quot;choices-grid&quot; id=&quot;${decId}&quot;&gt;
    ${order.map((c,i)=&gt;`&lt;div class=&quot;choice-card&quot;&gt;
      &lt;div class=&quot;cc-via&quot;&gt;Via ${[&#x27;I&#x27;,&#x27;II&#x27;,&#x27;III&#x27;][i]}&lt;/div&gt;
      &lt;div class=&quot;cc-latin&quot;&gt;${c.latin}&lt;span class=&quot;cc-sub&quot;&gt;${c.sub}&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;cc-predict-lbl&quot;&gt;Prediction (required) — what happens on this path?&lt;/div&gt;
      &lt;textarea class=&quot;cc-predict-input&quot; id=&quot;pred-${decId}-${c.key}&quot; placeholder=&quot;Predict (30+ characters), then choose…&quot;
        oninput=&quot;gateDec(&#x27;${decId}&#x27;,&#x27;${sumKey}&#x27;)&quot;&gt;&lt;/textarea&gt;
      &lt;div class=&quot;cc-count&quot; id=&quot;pcnt-${decId}-${c.key}&quot;&gt;0 / 30 minimum&lt;/div&gt;
      &lt;button class=&quot;cc-gate-btn&quot; id=&quot;choose-${decId}-${c.key}&quot; onclick=&quot;tryChoose(&#x27;${handler}&#x27;,&#x27;${decId}&#x27;,&#x27;${c.key}&#x27;)&quot;&gt;Choose this path →&lt;/button&gt;
    &lt;/div&gt;`).join(&#x27;&#x27;)}
  &lt;/div&gt;`;
}
function gateDec(decId, sumKey){
  const sumOk=(($(`sum-${sumKey}`)||{value:&#x27;&#x27;}).value.trim().length)&gt;=30;
  document.querySelectorAll(`#${decId} .cc-predict-input`).forEach(p=&gt;{
    const key=p.id.split(&#x27;-&#x27;).pop();
    const n=p.value.trim().length;
    const cnt=$(`pcnt-${decId}-${key}`);
    if(cnt){ cnt.textContent=`${n} / 30 minimum`; cnt.style.color=n&gt;=30?&#x27;#1e8449&#x27;:&#x27;#888&#x27;; }
    const b=$(`choose-${decId}-${key}`);
    if(b) b.classList.toggle(&#x27;ready&#x27;, sumOk &amp;&amp; n&gt;=30);
  });
}
function tryChoose(handler, decId, key){
  const b=$(`choose-${decId}-${key}`);
  if(!b||!b.classList.contains(&#x27;ready&#x27;)) return;
  window[handler](key);
}
function grabPred(decId,key){
  const p=$(`pred-${decId}-${key}`);
  if(p&amp;&amp;p.value.trim()) S.predictions[decId]=p.value.trim();
}

let drawSeq=0;
function drawItems(tab,force){
  if(DRAWN[tab]&amp;&amp;!force) return;
  const pool=[SPOT,NUMSORT,ROLEQ][tab];
  const idx=pool.map((_,i)=&gt;i);
  for(let i=idx.length-1;i&gt;0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  DRAWN[tab]=idx.slice(0,DRAW_N[tab]);
  drawSeq++;
}
function shufflePractice(tab){ drawItems(tab,true); renderPractice(tab); }

function renderPractice(tab){
  const tabs=[&#x27;① Spot the future&#x27;,&#x27;② Now — or later?&#x27;,&#x27;③ Read the promises&#x27;];
  drawItems(tab,false);
  const picks=DRAWN[tab];
  let body=&#x27;&#x27;;
  if(tab===0){
    body=`&lt;div class=&quot;acc-intro&quot;&gt;Every sentence has a &lt;b&gt;future&lt;/b&gt; verb — and most have a present-tense decoy. Click the &lt;b&gt;FUTURE&lt;/b&gt; (the &quot;will ___&quot;). New sentences every 🔀 shuffle — the pool holds ${SPOT.length}.
      &lt;div class=&quot;acc-rule&quot;&gt;Signals: &lt;b&gt;-bō / -bis / -bit / -bunt&lt;/b&gt; (parābit, dabunt) · sum’s own &lt;b&gt;erō / eris / erit / erunt&lt;/b&gt; · and the sneaky &lt;b&gt;-am / -ēs / -et / -ent&lt;/b&gt; (coquam, veniet, venient). Time-words help: crās, mox, ōlim!&lt;/div&gt;&lt;/div&gt;`+
    picks.map((si,k)=&gt;{ const s=SPOT[si], uid=`sp${drawSeq}x${si}`;
      return `&lt;div class=&quot;spot-sent&quot;&gt;
      &lt;div class=&quot;spot-num&quot;&gt;Sentence ${k+1}&lt;/div&gt;
      &lt;div class=&quot;spot-words&quot;&gt;
        ${s.words.map((w,wi)=&gt;`&lt;button class=&quot;word-btn&quot; id=&quot;${uid}-${wi}&quot; onclick=&quot;spotTap(${si},${wi},&#x27;${uid}&#x27;)&quot;&gt;${w}&lt;/button&gt;`).join(&#x27;&#x27;)}
        &lt;span class=&quot;spot-period&quot;&gt;.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;spot-fb&quot; id=&quot;${uid}-fb&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;`;}).join(&#x27;&#x27;);
  } else if(tab===1){
    body=`&lt;div class=&quot;acc-intro&quot;&gt;Happening now — or promised for later? Tap &lt;b&gt;Now&lt;/b&gt; (present) or &lt;b&gt;Fut&lt;/b&gt; (future) for each form. New forms every 🔀 shuffle — the pool holds ${NUMSORT.length}.
      &lt;div class=&quot;acc-rule&quot;&gt;The pairs: para&lt;b&gt;t&lt;/b&gt;/parā&lt;b&gt;bit&lt;/b&gt; · es&lt;b&gt;t&lt;/b&gt;/eri&lt;b&gt;t&lt;/b&gt; · doce&lt;b&gt;t&lt;/b&gt;/docē&lt;b&gt;bit&lt;/b&gt; — and the one-letter traps: veni&lt;b&gt;t&lt;/b&gt;/veni&lt;b&gt;et&lt;/b&gt; · coqui&lt;b&gt;t&lt;/b&gt;/coqu&lt;b&gt;et&lt;/b&gt; · dormi&lt;b&gt;t&lt;/b&gt;/dormi&lt;b&gt;et&lt;/b&gt;. One vowel, one whole tomorrow.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;sort-grid&quot;&gt;
      ${picks.map(i=&gt;{ const w=NUMSORT[i], uid=`np${drawSeq}x${i}`;
        return `&lt;div class=&quot;sort-item&quot;&gt;
        &lt;div class=&quot;sort-word&quot;&gt;&lt;em&gt;${w.w}&lt;/em&gt;&lt;/div&gt;
        &lt;div class=&quot;sort-btns&quot;&gt;
          &lt;button class=&quot;sb&quot; id=&quot;${uid}-1&quot; onclick=&quot;numTap(${i},1,&#x27;${uid}&#x27;)&quot;&gt;Now&lt;/button&gt;
          &lt;button class=&quot;sb&quot; id=&quot;${uid}-2&quot; onclick=&quot;numTap(${i},2,&#x27;${uid}&#x27;)&quot;&gt;Fut&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;spot-fb&quot; id=&quot;${uid}-fb&quot;&gt;&lt;/div&gt;`;}).join(&#x27;&#x27;)}
    &lt;/div&gt;`;
  } else {
    body=`&lt;div class=&quot;acc-intro&quot;&gt;Prophecies, promises, blessings, and toasts — the future tense does them all. Read each sentence from the story and choose the best answer. New sentences every 🔀 shuffle — the pool holds ${ROLEQ.length}.
      &lt;div class=&quot;acc-rule&quot;&gt;Strategy: find the future verb → name its family (-bi-, sneaky, or erit) → then ask: who promises what to whom — and does the story make you believe it?&lt;/div&gt;&lt;/div&gt;`+
    picks.map((ri,k)=&gt;{ const r=ROLEQ[ri], uid=`role${drawSeq}x${ri}`;
      return `&lt;div class=&quot;spot-sent&quot;&gt;
      &lt;div class=&quot;spot-num&quot;&gt;Sentence ${k+1}: &amp;nbsp;&lt;em style=&quot;font-size:1rem;&quot;&gt;${r.sent}&lt;/em&gt;&lt;/div&gt;
      &lt;div class=&quot;cq-prompt&quot; style=&quot;margin:4px 0 8px;&quot;&gt;${r.q}&lt;/div&gt;
      &lt;ul class=&quot;mc-list&quot; id=&quot;${uid}&quot;&gt;
        ${r.opts.map((o,oi)=&gt;`&lt;li&gt;&lt;button class=&quot;mc-btn&quot; onclick=&quot;mcAnswer(&#x27;${uid}&#x27;,&#x27;${uid}-fb&#x27;,${oi},${r.correct},
          &#x27;${attrStr(&#x27;Optimē! &#x27;+r.note)}&#x27;,&#x27;${attrStr(&#x27;Temptā iterum — find the person ending, then ask: finished or ongoing? &#x27;)}&#x27;)&quot;&gt;${o}&lt;/button&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}
      &lt;/ul&gt;
      &lt;div class=&quot;fb&quot; id=&quot;${uid}-fb&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;`;}).join(&#x27;&#x27;);
  }
  pg().innerHTML=`
  &lt;span class=&quot;back-link&quot; onclick=&quot;renderHome()&quot;&gt;← Home&lt;/span&gt;
  &lt;div class=&quot;acc-header&quot;&gt;&lt;h2&gt;Futūra Exercē&lt;/h2&gt;
    &lt;p&gt;Three drills on the future tense — the last new grammar of the series. After this: Stage 13!&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;acc-tabs&quot;&gt;
    ${tabs.map((t,i)=&gt;`&lt;button class=&quot;ast ${i===tab?&#x27;active&#x27;:&#x27;&#x27;}&quot; onclick=&quot;renderPractice(${i})&quot;&gt;${t}&lt;/button&gt;`).join(&#x27;&#x27;)}
    &lt;button class=&quot;ast ast-shuffle&quot; onclick=&quot;shufflePractice(${tab})&quot; title=&quot;Draw a new random set&quot;&gt;🔀 Shuffle&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;acc-layout&quot;&gt;
    &lt;div class=&quot;acc-ref&quot;&gt;
      &lt;h4&gt;Word bank — the future&lt;/h4&gt;
      &lt;div class=&quot;wb-head&quot;&gt;The -bi- family&lt;/div&gt;
      &lt;div class=&quot;wb-row&quot;&gt;&lt;span class=&quot;wb-nom&quot;&gt;parābō&lt;/span&gt;&lt;span class=&quot;wb-arr&quot;&gt;=&lt;/span&gt;&lt;span class=&quot;wb-acc&quot;&gt;I will prepare&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wb-row&quot;&gt;&lt;span class=&quot;wb-nom&quot;&gt;docēbis&lt;/span&gt;&lt;span class=&quot;wb-arr&quot;&gt;=&lt;/span&gt;&lt;span class=&quot;wb-acc&quot;&gt;you will teach&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wb-row&quot;&gt;&lt;span class=&quot;wb-nom&quot;&gt;dabit&lt;/span&gt;&lt;span class=&quot;wb-arr&quot;&gt;=&lt;/span&gt;&lt;span class=&quot;wb-acc&quot;&gt;he will give&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wb-row&quot;&gt;&lt;span class=&quot;wb-nom&quot;&gt;dabunt&lt;/span&gt;&lt;span class=&quot;wb-arr&quot;&gt;=&lt;/span&gt;&lt;span class=&quot;wb-acc&quot;&gt;they will give&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wb-head&quot;&gt;The sneaky family&lt;/div&gt;
      &lt;div class=&quot;wb-row&quot;&gt;&lt;span class=&quot;wb-nom&quot;&gt;coquam&lt;/span&gt;&lt;span class=&quot;wb-arr&quot;&gt;=&lt;/span&gt;&lt;span class=&quot;wb-acc&quot;&gt;I will cook&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wb-row&quot;&gt;&lt;span class=&quot;wb-nom&quot;&gt;veniet&lt;/span&gt;&lt;span class=&quot;wb-arr&quot;&gt;=&lt;/span&gt;&lt;span class=&quot;wb-acc&quot;&gt;he will come&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wb-row&quot;&gt;&lt;span class=&quot;wb-nom&quot;&gt;venient&lt;/span&gt;&lt;span class=&quot;wb-arr&quot;&gt;=&lt;/span&gt;&lt;span class=&quot;wb-acc&quot;&gt;they will come&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wb-head&quot;&gt;sum’s own&lt;/div&gt;
      &lt;div class=&quot;wb-row&quot;&gt;&lt;span class=&quot;wb-nom&quot;&gt;erō · eris&lt;/span&gt;&lt;span class=&quot;wb-arr&quot;&gt;=&lt;/span&gt;&lt;span class=&quot;wb-acc&quot;&gt;I / you will be&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wb-row&quot;&gt;&lt;span class=&quot;wb-nom&quot;&gt;erit · erunt&lt;/span&gt;&lt;span class=&quot;wb-arr&quot;&gt;=&lt;/span&gt;&lt;span class=&quot;wb-acc&quot;&gt;it / they will be&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wb-head&quot;&gt;Time-words&lt;/div&gt;
      &lt;div class=&quot;wb-row&quot;&gt;&lt;span class=&quot;wb-nom&quot;&gt;crās&lt;/span&gt;&lt;span class=&quot;wb-arr&quot;&gt;=&lt;/span&gt;&lt;span class=&quot;wb-acc&quot;&gt;tomorrow&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wb-row&quot;&gt;&lt;span class=&quot;wb-nom&quot;&gt;mox&lt;/span&gt;&lt;span class=&quot;wb-arr&quot;&gt;=&lt;/span&gt;&lt;span class=&quot;wb-acc&quot;&gt;soon&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wb-row&quot;&gt;&lt;span class=&quot;wb-nom&quot;&gt;ōlim&lt;/span&gt;&lt;span class=&quot;wb-arr&quot;&gt;=&lt;/span&gt;&lt;span class=&quot;wb-acc&quot;&gt;one day&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wb-head&quot;&gt;Don&#x27;t confuse&lt;/div&gt;
      &lt;div class=&quot;wb-row&quot;&gt;&lt;span class=&quot;wb-nom&quot;&gt;venit&lt;/span&gt;&lt;span class=&quot;wb-arr&quot;&gt;≠&lt;/span&gt;&lt;span class=&quot;wb-acc&quot;&gt;veniet (will come!)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wb-row&quot;&gt;&lt;span class=&quot;wb-nom&quot;&gt;vidēbam&lt;/span&gt;&lt;span class=&quot;wb-arr&quot;&gt;≠&lt;/span&gt;&lt;span class=&quot;wb-acc&quot;&gt;vidēbō (-bam past, -bō future)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wb-note&quot;&gt;sīc erat · sīc est · sīc erit — you can now read all three. valē, et bene coquēs!&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;acc-main&quot;&gt;${body}&lt;/div&gt;
  &lt;/div&gt;`;
}
function spotTap(si,wi,uid){
  const s=SPOT[si];
  if(S.spotState[uid]) return;
  const ok=(wi===s.pf);
  S.spotState[uid]=true;
  S.score.t++; if(ok) S.score.c++; updateScore();
  const btn=$(`${uid}-${wi}`);
  btn.classList.add(ok?&#x27;correct&#x27;:&#x27;wrong&#x27;);
  if(!ok) $(`${uid}-${s.pf}`).classList.add(&#x27;correct&#x27;);
  for(let i=0;i&lt;s.words.length;i++){ const b=$(`${uid}-${i}`); if(b) b.disabled=true; }
  const fb=$(`${uid}-fb`);
  fb.textContent=(ok?&#x27;Optimē! &#x27;:&#x27;&#x27;)+s.note;
  fb.className=`spot-fb ${ok?&#x27;ok&#x27;:&#x27;err&#x27;}`;
}
function numTap(i,choice,uid){
  const w=NUMSORT[i];
  if(S.spotState[uid]) return;
  S.spotState[uid]=true;
  const correct=w.pf?2:1, ok=(choice===correct);
  S.score.t++; if(ok) S.score.c++; updateScore();
  [1,2].forEach(d=&gt;{
    const b=$(`${uid}-${d}`); if(!b) return; b.disabled=true;
    if(d===choice) b.classList.add(ok?&#x27;s-ok&#x27;:&#x27;s-err&#x27;);
    if(!ok&amp;&amp;d===correct) b.classList.add(&#x27;s-rev&#x27;);
  });
  const fb=$(`${uid}-fb`);
  fb.textContent=(ok?&#x27;Optimē! &#x27;:&#x27;&#x27;)+w.note;
  fb.className=`spot-fb ${ok?&#x27;ok&#x27;:&#x27;err&#x27;}`;
}

/* INIT */
applySupports();
renderHome();
&lt;/script&gt;
&lt;/body&gt;

"></iframe>
</div>
<script>
  const btns = document.querySelectorAll('.nav-btn');
  const panes = document.querySelectorAll('iframe');
  let cur = 0;
  function show(i){
    btns[cur].classList.remove('active');
    panes[cur].classList.remove('active');
    cur = i;
    btns[cur].classList.add('active');
    panes[cur].classList.add('active');
  }
</script>
