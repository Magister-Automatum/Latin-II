<!DOCTYPE html>
<html lang="la">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Villa</title>
<style>
  :root{
    --ink:#2b241d; --ink-soft:#7a6d5e;
    --paper:#f7f2e8; --paper-2:#fffdf8;
    --line:#e0d3bd; --pompeii:#9c3327; --ochre:#b8873a;
    --shadow:0 1px 2px rgba(43,36,29,.05), 0 8px 24px rgba(43,36,29,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 12% 6%, rgba(184,135,58,.08), transparent 42%),
      radial-gradient(circle at 88% 2%, rgba(156,51,39,.07), transparent 38%);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:34px 20px 60px}

  .top{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:30px}
  .title{
    font-size:clamp(1.9rem,4.6vw,2.7rem);letter-spacing:.16em;text-transform:uppercase;
    margin:0;font-weight:600;color:var(--pompeii);
  }
  .tools{display:flex;gap:7px}
  .tools button{
    width:38px;height:38px;border-radius:50%;cursor:pointer;padding:0;
    border:1px solid var(--line);background:var(--paper-2);color:var(--ink-soft);
    display:grid;place-items:center;box-shadow:var(--shadow);
    transition:transform .12s ease,border-color .12s ease,color .12s ease;
  }
  .tools button:hover{border-color:var(--ochre);color:var(--pompeii);transform:translateY(-1px)}
  .tools button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px}

  .card{
    background:var(--paper-2);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);overflow:hidden;
  }
  .scene{display:block;width:100%;height:auto;background:#e8dcc6}

  .lines{padding:16px 20px 18px;font-size:1.24rem;line-height:2.05}
  .lines .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lines .nm{font-weight:600;color:var(--pompeii)}

  select{
    font-family:inherit;font-size:1.24rem;color:var(--ink);
    padding:0 20px 2px 3px;margin:0 1px;
    border:0;border-bottom:2px dotted var(--ochre);border-radius:0;
    background:transparent url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7'><path d='M1 1l4.5 4.5L10 1' fill='none' stroke='%23b8873a' stroke-width='1.7' stroke-linecap='round'/></svg>") no-repeat right 2px center;
    -webkit-appearance:none;appearance:none;cursor:pointer;
  }
  select:focus{outline:2px solid var(--ochre);outline-offset:3px;border-radius:3px}
  select.empty{color:#c3b49b}

  .gear{
    margin:34px auto 0;display:block;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line);background:transparent;color:#cbbda6;cursor:pointer;
    display:grid;place-items:center;
  }
  .gear:hover{color:var(--ochre);border-color:var(--ochre)}
  .gear svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}

  dialog{
    border:1px solid var(--line);border-radius:14px;padding:0;max-width:760px;width:92%;
    background:var(--paper-2);color:var(--ink);box-shadow:0 24px 60px rgba(43,36,29,.28);
  }
  dialog::backdrop{background:rgba(43,36,29,.42)}
  .dlg{padding:22px 24px 20px}
  .lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
  .lists h3{margin:0 0 7px;font-size:1rem;letter-spacing:.05em;color:var(--pompeii);font-weight:600}
  .lists textarea{
    width:100%;min-height:170px;font-family:inherit;font-size:.98rem;line-height:1.6;
    padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;
    color:var(--ink);resize:vertical;
  }
  .dlg-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  .dlg-actions button{
    font-family:inherit;font-size:.92rem;padding:8px 16px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink);
  }
  .dlg-actions button.primary{background:var(--pompeii);border-color:var(--pompeii);color:#fff}

  #meas{position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0}

  @media print{
    body{background:#fff}
    .tools,.gear{display:none!important}
    .wrap{padding:0}
    .card{box-shadow:none;break-inside:avoid}
    .grid{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 class="title">In Villa</h1>
    <div class="tools">
      <button id="btnRandom" title="sortiri"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg></button>
      <button id="btnClear" title="delere"><svg viewBox="0 0 24 24"><path d="M20 20H8.5L3 14.5a1.5 1.5 0 0 1 0-2.1l7-7a1.5 1.5 0 0 1 2.1 0l7.4 7.4a1.5 1.5 0 0 1 0 2.1z"/><path d="M11 9l6 6M17 9l-6 6"/></svg></button>
      <button id="btnPrint" title="imprimere"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><rect x="7" y="15" width="10" height="6"/></svg></button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <button class="gear" id="btnGear" title="edit lists"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1L5.3 5.3"/></svg></button>
</div>

<dialog id="dlg"><div class="dlg">
  <div class="lists">
    <div><h3>Personae</h3><textarea id="taChars" spellcheck="false"></textarea></div>
    <div><h3>Loca</h3><textarea id="taPlaces" spellcheck="false"></textarea></div>
    <div><h3>Verba</h3><textarea id="taVerbs" spellcheck="false"></textarea></div>
  </div>
  <div class="dlg-actions">
    <button id="btnRestore">Restore original</button>
    <button id="btnCancel">Cancel</button>
    <button class="primary" id="btnApply">Apply</button>
  </div>
</div></dialog>

<span id="meas"></span>

"laborat": function(c){ return '<g transform="rotate(-7 50 100)">'+head(50,26,13)+
  tunic(c)+
  '<line x1="72" y1="34" x2="86" y2="104" stroke="'+WOOD+'" stroke-width="5" stroke-linecap="round"/>'+
  '<path d="M80 100h18v9H82z" fill="#8f8a80"/>'+
  limb(37,46,44,68)+limb(63,46,76,52)+
  limb(44,86,40,114,9.5)+limb(58,86,62,114,9.5)+'</g>'; },

"latrat": function(c){ return head(52,24,13)+
  '<ellipse cx="63" cy="30" rx="5" ry="4" fill="#7d3a30"/>'+
  tunic(c)+
  limb(37,46,29,70)+limb(63,46,72,66)+
  limb(44,86,43,114,9.5)+limb(57,86,58,114,9.5)+
  '<g fill="none" stroke="#9c3327" stroke-width="2.4" stroke-linecap="round" opacity=".75">'+
  '<path d="M76 20a16 16 0 0 1 0 20"/><path d="M85 13a28 28 0 0 1 0 34"/></g>'; }
};

function dogFigure(c, verb){
  if(verb === "dormit"){
    return '<rect x="4" y="104" width="112" height="10" rx="5" fill="#c9b38a"/>'+
      '<ellipse cx="52" cy="92" rx="34" ry="16" fill="'+c+'"/>'+
      '<circle cx="94" cy="92" r="13" fill="'+c+'"/>'+
      '<ellipse cx="107" cy="97" rx="10" ry="6" fill="#c9a883"/>'+
      '<circle cx="114" cy="96" r="2.8" fill="#3d2b1f"/>'+
      '<path d="M88 82l-3-14 13 8z" fill="#6d5138"/>'+
      '<path d="M90 89h7" stroke="#2b241d" stroke-width="2" stroke-linecap="round"/>'+
      '<path d="M20 90c-9-6-14-16-7-20 2 12 8 15 13 16z" fill="'+c+'"/>'+
      '<g fill="none" stroke="#a89a80" stroke-width="2" stroke-linecap="round">'+
      '<path d="M104 68h10l-10 10h10"/><path d="M118 52h7l-7 7h7"/></g>';
  }
  if(verb === "sedet"){
    return '<path d="M34 114c-8-20-4-42 12-46 18-4 26 10 26 26 0 8-2 15-4 20z" fill="'+c+'"/>'+
      '<circle cx="72" cy="58" r="15" fill="'+c+'"/>'+
      '<ellipse cx="87" cy="63" rx="11" ry="7" fill="#c9a883"/>'+
      '<circle cx="95" cy="61" r="3" fill="#3d2b1f"/>'+
      '<circle cx="74" cy="53" r="2.4" fill="#2b241d"/>'+
      '<path d="M62 46l-4-18 16 10z" fill="#6d5138"/>'+
      '<path d="M80 70q6 4 12 2" stroke="#7d3a30" stroke-width="2.4" fill="none" stroke-linecap="round"/>'+
      '<g stroke="'+c+'" stroke-width="9" stroke-linecap="round">'+
      '<line x1="62" y1="98" x2="64" y2="114"/><line x1="76" y1="98" x2="78" y2="114"/></g>'+
      '<path d="M26 106c-10-4-16-14-10-19 4 11 10 14 16 14z" fill="'+c+'"/>';
  }
  var barking = (verb === "latrat");
  return '<ellipse cx="46" cy="82" rx="30" ry="17" fill="'+c+'"/>'+
    '<circle cx="80" cy="60" r="15" fill="'+c+'"/>'+
    '<ellipse cx="95" cy="65" rx="11" ry="7" fill="#c9a883"/>'+
    '<circle cx="103" cy="63" r="3" fill="#3d2b1f"/>'+
    '<circle cx="82" cy="55" r="2.4" fill="#2b241d"/>'+
    '<path d="M70 48l-4-18 16 10z" fill="#6d5138"/>'+
    '<path d="M14 76c-8-10-12-22-4-28 4 14 10 18 16 20z" fill="'+c+'"/>'+
    '<g stroke="'+c+'" stroke-width="9" stroke-linecap="round">'+
    '<line x1="28" y1="96" x2="26" y2="114"/><line x1="44" y1="98" x2="44" y2="114"/>'+
    '<line x1="60" y1="96" x2="62" y2="114"/></g>'+
    '<path d="M88 72q6 4 12 2" stroke="#7d3a30" stroke-width="2.4" fill="none" stroke-linecap="round"/>'+
    (barking ? '<g fill="none" stroke="#9c3327" stroke-width="2.6" stroke-linecap="round" opacity=".8">'+
      '<path d="M114 52a16 16 0 0 1 0 20"/><path d="M124 44a28 28 0 0 1 0 36"/></g>' : '');
}

function sceneSVG(name, tint, place, verb){
  var bg = place ? (PLACES[place] || PLACE_FALLBACK) : PLACE_FALLBACK;
  var fig = "";
  if(DOGS[name]){
    fig = '<g transform="translate(126,110)">' + dogFigure(tint, verb) + '</g>';
  } else if(verb && POSES[verb]){
    fig = '<g transform="translate(146,104)">' + POSES[verb](tint) + '</g>';
  } else if(verb){
    fig = '<g transform="translate(146,104)">' + POSES["stat"](tint) + '</g>';
  } else {
    fig = '<g transform="translate(146,104)" opacity=".26">' + POSES["stat"](tint) + '</g>';
  }
  return '<svg class="scene" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg" '+
         'preserveAspectRatio="xMidYMid slice" role="img" aria-label="'+name+'">'+
         bg + '<ellipse cx="196" cy="223" rx="44" ry="8.5" fill="rgba(43,36,29,.15)"/>' + fig +
         '</svg>';
}

/* ------------------------------------------------------------------ view */
var grid = document.getElementById("grid");
var meas = document.getElementById("meas");

function fit(sel){
  var cs = window.getComputedStyle(sel);
  meas.style.font = cs.fontStyle+" "+cs.fontVariant+" "+cs.fontWeight+" "+cs.fontSize+"/"+cs.lineHeight+" "+cs.fontFamily;
  meas.style.letterSpacing = cs.letterSpacing;
  meas.textContent = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : "";
  sel.style.width = (meas.offsetWidth + 26) + "px";
  sel.classList.toggle("empty", !sel.value);
}

function mkSelect(kind, idx, list){
  var s = document.createElement("select");
  var ph = document.createElement("option");
  ph.value = ""; ph.textContent = "———";
  s.appendChild(ph);
  list.forEach(function(v){
    var o = document.createElement("option");
    o.value = v; o.textContent = v; s.appendChild(o);
  });
  s.value = (choice[idx] && choice[idx][kind]) || "";
  s.addEventListener("change", function(){
    choice[idx][kind] = s.value;
    fit(s);
    repaint(idx);
  });
  return s;
}

function repaint(i){
  var card = grid.querySelector('[data-card="'+i+'"]');
  if(!card) return;
  var c = choice[i] || {};
  var name = data.chars[i];
  card.querySelector(".sceneSlot").innerHTML = sceneSVG(name, tintFor(name, i), c.place, c.verb);
}

function render(){
  grid.innerHTML = "";
  data.chars.forEach(function(name, i){
    if(!choice[i]) choice[i] = {place:"", verb:""};
    var c = choice[i];

    var card = document.createElement("div");
    card.className = "card";
    card.setAttribute("data-card", i);

    var slot = document.createElement("div");
    slot.className = "sceneSlot";
    slot.innerHTML = sceneSVG(name, tintFor(name, i), c.place, c.verb);
    card.appendChild(slot);

    var lines = document.createElement("div");
    lines.className = "lines";

    var l1 = document.createElement("div");
    l1.className = "ln";
    var n1 = document.createElement("span"); n1.className = "nm"; n1.textContent = name;
    var selP = mkSelect("place", i, data.places);
    l1.appendChild(n1); l1.appendChild(document.createTextNode(" est ")); l1.appendChild(selP);

    var l2 = document.createElement("div");
    l2.className = "ln";
    var n2 = document.createElement("span"); n2.className = "nm"; n2.textContent = name;
    var selV = mkSelect("verb", i, data.verbs);
    l2.appendChild(n2); l2.appendChild(document.createTextNode(" ")); l2.appendChild(selV);

    lines.appendChild(l1); lines.appendChild(l2);
    card.appendChild(lines);
    grid.appendChild(card);

    fit(selP); fit(selV);
  });
}

/* --------------------------------------------------------------- actions */
document.getElementById("btnRandom").addEventListener("click", function(){
  data.chars.forEach(function(n, i){
    choice[i] = {
      place: data.places.length ? data.places[Math.floor(Math.random()*data.places.length)] : "",
      verb:  data.verbs.length  ? data.verbs[Math.floor(Math.random()*data.verbs.length)]   : ""
    };
  });
  render();
});
document.getElementById("btnClear").addEventListener("click", function(){
  choice = [];
  render();
});
document.getElementById("btnPrint").addEventListener("click", function(){ window.print(); });

var dlg = document.getElementById("dlg");
var taChars = document.getElementById("taChars"),
    taPlaces = document.getElementById("taPlaces"),
    taVerbs = document.getElementById("taVerbs");

function fill(){
  taChars.value = data.chars.join("\n");
  taPlaces.value = data.places.join("\n");
  taVerbs.value = data.verbs.join("\n");
}
function lines(t){ return t.split("\n").map(function(s){return s.trim();}).filter(Boolean); }

document.getElementById("btnGear").addEventListener("click", function(){ fill(); dlg.showModal(); });
document.getElementById("btnCancel").addEventListener("click", function(){ dlg.close(); });
document.getElementById("btnRestore").addEventListener("click", function(){
  data = {chars:ORIGINAL.chars.slice(), places:ORIGINAL.places.slice(), verbs:ORIGINAL.verbs.slice()};
  choice = []; fill(); render();
});
document.getElementById("btnApply").addEventListener("click", function(){
  var ch = lines(taChars.value), pl = lines(taPlaces.value), vb = lines(taVerbs.value);
  if(!ch.length) ch = ORIGINAL.chars.slice();
  var old = data.chars, kept = [];
  ch.forEach(function(n, i){
    var prev = (old[i] === n && choice[i]) ? choice[i] : {place:"", verb:""};
    kept[i] = {
      place: pl.indexOf(prev.place) === -1 ? "" : prev.place,
      verb:  vb.indexOf(prev.verb)  === -1 ? "" : prev.verb
    };
  });
  data.chars = ch; data.places = pl; data.verbs = vb; choice = kept;
  render(); dlg.close();
});

fill();
render();
})();
</script>
